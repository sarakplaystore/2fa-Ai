plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sarakplaystore.still'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sarakplaystore.still'
        minSdk 30 // CryptoObject + BIOMETRIC_STRONG | DEVICE_CREDENTIAL
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Do not create an installable APK containing a blank or stale Vite scaffold.
// Run `npm run build:android` first (also done in the CI workflow).
tasks.register('verifyWebAssets') {
    doLast {
        def html = file('src/main/assets/www/index.html')
        def assets = file('src/main/assets/www/assets')
        if (!html.isFile() || !assets.isDirectory() || !html.text.contains('/assets/')) {
            throw new GradleException('Missing Android web bundle. Run npm ci && npm run build:android first.')
        }
    }
}
tasks.named('preBuild') { dependsOn tasks.named('verifyWebAssets') }
