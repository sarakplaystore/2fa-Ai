name: Android debug APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/build-android.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes this SDK; avoid downloading command-line
      # tools again just to build an offline app.
      - name: Check installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      # One-off transfer to this fixed session branch: the Actions artifact
      # store is inaccessible from the sandbox, but git transport is available.
      - name: Put requested APK on the session branch
        if: github.ref == 'refs/heads/arena/532457b0-2fa-ai'
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/StillAuthenticator-debug.apk
          git add -f apk/StillAuthenticator-debug.apk
          git -c user.name='Arena Build' -c user.email='build@users.noreply.github.com' commit -m 'Add installable Still Android debug APK'
          git push origin HEAD:arena/532457b0-2fa-ai
      - uses: actions/upload-artifact@v4
        with:
          name: still-authenticator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
