name: Android debug APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'scripts/build-android.mjs'
  workflow_dispatch:
    inputs:
      update_apk:
        description: 'Update the checked-in debug APK on an arena branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debug-apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes this SDK; avoid downloading command-line
      # tools again just to build an offline app.
      - name: Check installed Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: still-authenticator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Explicit opt-in only. APK-only commits do not retrigger this workflow.
      - name: Update downloadable APK
        if: github.event_name == 'workflow_dispatch' && inputs.update_apk && startsWith(github.ref, 'refs/heads/arena/')
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/StillAuthenticator-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/StillAuthenticator-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update bundled Android debug APK"
            git push origin "HEAD:$BUILD_BRANCH"
          fi
